[package]
name = "kiss"
version = "0.4.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "signal", "time", "macros"] }
httpdate = "1.0.3"

[dev-dependencies]
tempfile = "3.27"
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
