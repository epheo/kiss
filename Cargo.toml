[package]
name = "kiss"
version = "0.3.0"
edition = "2021"

[lib]
name = "kiss"
path = "src/lib.rs"

[[bin]]
name = "kiss"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "io-util", "signal", "time", "macros"] }
httpdate = "1.0"
rustc-hash = "2.0"
clap = { version = "4.0", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3.8"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true